# cc-workflow nginx reverse proxy.
#
# Install (Phase 1 — HTTP only, no cert):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cc-workflow
#   sudo ln -sf /etc/nginx/sites-available/cc-workflow /etc/nginx/sites-enabled/cc-workflow
#   # If the stock default page is in the way, also disable it:
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Phase 3 adds HTTPS (dev-plan §10 step 8 — certbot --nginx -d <domain>).
# Phase 3 may also move HTTP Basic auth from FastAPI into nginx; until then
# the inner backend/auth.py is the password gate.

server {
    listen 80 default_server;
    server_name _;     # catch-all — covers IP-direct access too

    # agent-run prompts can be a few KB; leave headroom but don't be silly.
    client_max_body_size 1m;

    # Don't leak nginx version on errors.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /run returns task_id immediately (<100ms target). Polling /runs/{id}
        # is also quick. 60s read timeout covers both with plenty of headroom.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
