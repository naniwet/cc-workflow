# cc-workflow nginx reverse proxy.
#
# Install — see deploy/INSTALL.md for full setup. TL;DR:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cc-workflow
#   sudo ln -sf /etc/nginx/sites-available/cc-workflow /etc/nginx/sites-enabled/cc-workflow
#   sudo rm -f /etc/nginx/sites-enabled/default      # if stock page is in the way
#   sudo nginx -t && sudo systemctl reload nginx
#
# Phase 3 (deferred): HTTPS via `certbot --nginx -d <domain>`. Once HTTPS lands,
# also add HSTS (Strict-Transport-Security) and upgrade-insecure-requests in
# the CSP. Until then we run plain HTTP — the backend's basic auth is the
# only password gate.

server {
    listen 80 default_server;
    server_name _;                      # catch-all — covers IP-direct access too

    # agent-run prompts can be a few KB; Feishu encrypted webhook bodies can
    # reach ~10KB for richer events. 1 MB is plenty without being silly.
    client_max_body_size 1m;

    # Don't leak nginx version on errors.
    server_tokens off;

    # Security headers (defense in depth — applies to every location below
    # because no inner location redefines add_header, so inheritance holds).
    add_header X-Content-Type-Options "nosniff"   always;
    add_header X-Frame-Options        "DENY"      always;
    add_header Referrer-Policy        "no-referrer" always;

    # Shared proxy headers — inherited by every location (none below
    # redefines proxy_set_header, so the inheritance rule is satisfied).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Service worker — never cache, so an updated /pwa/sw.js rolls out the
    # next time the browser revalidates. `expires -1` sets Cache-Control:
    # no-cache and an Expires header in the past.
    location = /pwa/sw.js {
        proxy_pass http://127.0.0.1:8765;
        expires -1;
    }

    # Tool-approval hook endpoints — invoked by cc-approve-hook.sh on the
    # SAME host (calls 127.0.0.1:8765 directly, bypassing nginx). Block
    # any public attempt to hit them, since they're unauthenticated and
    # would let an attacker forge approvals or DoS the queue.
    location /approvals/internal/ {
        deny all;
        return 403;
    }

    # Cron-trigger endpoints (POST /loops/<name>/run/internal) — same
    # localhost-only contract as /approvals/internal/. /etc/cron.d/cc-loops
    # entries are curl lines hitting 127.0.0.1:8765 directly. Any external
    # attempt to hit these would let a stranger fire your scheduled
    # workloads at will.
    location ~ ^/loops/[^/]+/run/internal$ {
        deny all;
        return 403;
    }

    # Other PWA static assets — short browser cache. 1h is short enough that
    # a hard refresh isn't needed after a deploy, but long enough that polling
    # the SPA doesn't re-download app.js / style.css every render.
    location /pwa/ {
        proxy_pass http://127.0.0.1:8765;
        expires 1h;
    }

    # PWA 上传文件入口 — multipart,单请求合计 10 MB。其他 JSON 路由仍走全局
    # 的 1m 限制(/run 等只发 prompt 文本,1MB 足够)。只为这个 location 调大,
    # 避免给 /run 留 10MB 的 DoS 表面。
    location ~ ^/uploads/[^/]+$ {
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:8765;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Backend API — no proxy cache. /run returns task_id immediately
    # (<100ms target); polling /runs/{id} is also quick; 60s read timeout
    # covers both with plenty of headroom for slow LLM-streamed responses.
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
