<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="cc-workflow">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/pwa/manifest.json">
<link rel="apple-touch-icon" href="/pwa/icon.svg">
<link rel="icon" type="image/svg+xml" href="/pwa/icon.svg">
<link rel="stylesheet" href="/pwa/style.css">
<title>cc-workflow</title>
</head>
<body>
  <header class="topbar">
    <span class="brand">cc-workflow</span>
    <nav class="tabs" id="tabs">
      <a href="#workspaces" data-tab="workspaces" class="tab">Workspaces</a>
      <a href="#tasks" data-tab="tasks" class="tab">Tasks</a>
    </nav>
    <span class="status" id="status"></span>
  </header>

  <main id="view"><p class="muted">Loading…</p></main>

  <!-- Mobile bottom-nav (< 768px). Same data-tab semantics as the topbar
       tabs — setActiveTab() updates both in lockstep. SVGs are inline so
       there's nothing to fetch and no icon-font flash. -->
  <nav class="bottom-nav" id="bottom-nav">
    <a href="#workspaces" data-tab="workspaces" class="bottom-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3"  y="3"  width="7" height="7" rx="1"/>
        <rect x="14" y="3"  width="7" height="7" rx="1"/>
        <rect x="3"  y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Workspaces</span>
    </a>
    <a href="#tasks" data-tab="tasks" class="bottom-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 11 12 14 22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      <span>Tasks</span>
    </a>
  </nav>

  <!-- #toast-container is created lazily by app.js on first showToast() call. -->

  <script type="module" src="/pwa/app.js"></script>
</body>
</html>
