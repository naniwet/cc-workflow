<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-workflow</title>
<style>
*{font-family:ui-monospace,monospace;box-sizing:border-box}
body{margin:0;padding:12px;background:#fff;color:#111;max-width:960px}
h1,h2,h3{margin:8px 0}
section{border:1px solid #999;padding:8px;margin:8px 0}
input,select,textarea,button{font:inherit;padding:4px;margin:2px 0;width:100%}
textarea{min-height:80px;resize:vertical}
button{cursor:pointer;background:#ddd;border:1px solid #888}
pre{background:#f4f4f4;padding:6px;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.row{display:flex;gap:12px}.row>*{flex:1}
.tag{display:inline-block;padding:1px 6px;border:1px solid #888;font-size:11px;margin-right:4px}
.tag-running{background:#ffe}.tag-queued{background:#eef}.tag-done{background:#efe}.tag-failed{background:#fee}
small{color:#666}
</style>

<h1>cc-workflow</h1>
<small>Phase 1 — intentionally ugly. Goal: get to Phase 2 (PWA) ASAP.</small>

<section>
  <h2>Trigger</h2>
  <label>workspace <input id="w" value="test-repo"></label>
  <div class="row">
    <label>engine <select id="e"><option>claude</option><option>codex</option></select></label>
    <label>session_key <input id="sk" placeholder="(optional)"></label>
  </div>
  <label>prompt <textarea id="p" placeholder="reply with only OK"></textarea></label>
  <button id="go">Run</button>
  <div id="r"></div>
</section>

<section>
  <h2>Sessions <small id="ts"></small></h2>
  <div id="ss"></div>
</section>

<script>
const $=id=>document.getElementById(id);
const tag=s=>`<span class="tag tag-${s}">${s}</span>`;
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function api(path,opts={}){
  return (await fetch(path,{headers:{"Content-Type":"application/json"},...opts})).json();
}

function row(t,full){
  if(!t||t.detail)return `<pre>${esc(JSON.stringify(t,null,2))}</pre>`;
  return `<div>${tag(t.status)}<code>${t.id}</code> · ${t.workspace} · ${t.engine} · sk=${t.session_key??"-"} · elapsed ${t.elapsed_s??"-"}s · exit ${t.exit_code??"-"}</div>`
    + (t.pr_url?`<div>PR: <a href="${t.pr_url}" target="_blank">${t.pr_url}</a></div>`:"")
    + (full?`<pre>${esc(t.output||"")}</pre>`:"");
}

async function go(){
  const b={workspace:$("w").value.trim(),engine:$("e").value,prompt:$("p").value.trim()};
  const sk=$("sk").value.trim(); if(sk)b.session_key=sk;
  if(!b.workspace||!b.prompt){$("r").innerHTML="<small>workspace + prompt required</small>";return}
  $("r").innerHTML="<small>submitting...</small>";
  const r=await api("/run",{method:"POST",body:JSON.stringify(b)});
  if(!r.task_id){$("r").innerHTML=`<pre>${esc(JSON.stringify(r,null,2))}</pre>`;return}
  for(let i=0;i<200;i++){
    const t=await api(`/runs/${r.task_id}`);
    $("r").innerHTML=row(t,true);
    if(t.status==="done"||t.status==="failed")return;
    await new Promise(x=>setTimeout(x,2000));
  }
}

async function tick(){
  try{
    const s=await api("/sessions");
    $("ss").innerHTML=["active","queued","recent"].map(k=>
      `<h3>${k} (${s[k].length})</h3>${s[k].map(r=>row(r,false)).join("")||"<small>(none)</small>"}`
    ).join("");
    $("ts").textContent="· "+new Date().toLocaleTimeString();
  }catch(e){$("ts").textContent="· error"}
}

$("go").onclick=go;
tick();
setInterval(tick,5000);
</script>
